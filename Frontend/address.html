<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select Delivery Address - DENTIST BAZAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @keyframes robotPulse { 0% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(13, 148, 136, 0); } 100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); } }
        .robot-avatar { animation: robotPulse 2.5s infinite; }
    </style>
</head>
<body class="bg-[#f1f3f6] text-[#212121] font-sans antialiased text-xs font-semibold flex flex-col min-h-screen pt-[115px]" x-data="addressApp()" x-init="initAddressPage()">

    <!-- FLOATING AI ROBOT BUTTON (BOTTOM LEFT - CONSISTENT ACROSS ALL PAGES) -->
    <div class="fixed bottom-6 left-6 z-[9990] select-none">
        <button @click="aiDrawerOpen = !aiDrawerOpen" class="bg-gradient-to-br from-teal-600 to-slate-900 hover:from-teal-500 hover:to-slate-950 text-white rounded-full flex items-center justify-center shadow-2xl transition duration-300 hover:scale-110 p-4 border-2 border-teal-300 cursor-pointer relative robot-avatar group">
            <span class="text-2xl">🤖</span>
            <span class="absolute left-16 bg-slate-900 text-teal-300 text-[10px] font-black px-3.5 py-2 rounded-2xl shadow-2xl whitespace-nowrap hidden group-hover:block uppercase tracking-wider border border-teal-500">✨ Ask Smart AI Copilot</span>
        </button>
    </div>

    <!-- ULTRA-INTERACTIVE, BEAUTIFUL & STYLISH AI CHAT DRAWER -->
    <div x-show="aiDrawerOpen" class="fixed bottom-24 left-6 z-[9995] w-80 sm:w-96 bg-slate-900 rounded-3xl shadow-2xl border-2 border-teal-500/80 overflow-hidden flex flex-col h-[520px]" x-cloak x-transition>
        <!-- AI HEADER -->
        <header class="bg-gradient-to-r from-teal-900 via-slate-900 to-slate-900 text-white p-4 flex items-center justify-between border-b border-teal-700/50 shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-2xl bg-teal-500/20 border border-teal-400/40 flex items-center justify-center text-lg shadow-inner animate-pulse">🤖</div>
                <div>
                    <h4 class="font-black text-xs uppercase tracking-wider text-teal-300 flex items-center gap-1.5">
                        <span>Smart AI Copilot</span>
                        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    </h4>
                    <p class="text-[9px] text-slate-400 font-mono">Connected to Live Database Inventory</p>
                </div>
            </div>
            <button @click="aiDrawerOpen = false" class="text-slate-400 hover:text-white font-black text-sm cursor-pointer bg-slate-800/80 w-7 h-7 rounded-full flex items-center justify-center transition hover:bg-slate-700">✕</button>
        </header>

        <!-- CHAT MESSAGES STREAM CONTAINER WITH AUTO-SCROLL -->
        <div x-ref="chatContainer" class="flex-1 p-4 overflow-y-auto space-y-3.5 bg-slate-950 text-xs font-medium">
            <template x-for="(msg, mIdx) in aiMessages" :key="mIdx">
                <div class="flex flex-col space-y-1" :class="msg.role === 'user' ? 'items-end' : 'items-start'">
                    <div class="max-w-[88%] rounded-2xl p-3.5 shadow-lg text-xs leading-relaxed" :class="msg.role === 'user' ? 'bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-br-none shadow-teal-900/30' : 'bg-slate-900/90 text-teal-100 border border-teal-500/20 rounded-bl-none shadow-black'">
                        <p x-html="msg.text" class="space-y-1"></p>
                    </div>
                    <span class="text-[9px] text-slate-500 font-mono px-1.5" x-text="msg.time"></span>
                </div>
            </template>
        </div>

        <!-- QUICK CHIP PROMPTS -->
        <div class="px-3 py-2 bg-slate-900/80 border-t border-slate-800 flex gap-1.5 overflow-x-auto text-[10px]">
            <button @click="aiUserInput = 'Show me best dental chairs'; sendAiMessage();" class="bg-teal-950 hover:bg-teal-900 text-teal-300 border border-teal-700/60 px-2.5 py-1 rounded-xl whitespace-nowrap cursor-pointer transition">💺 Dental Chairs</button>
            <button @click="aiUserInput = 'Check Alginate stock'; sendAiMessage();" class="bg-teal-950 hover:bg-teal-900 text-teal-300 border border-teal-700/60 px-2.5 py-1 rounded-xl whitespace-nowrap cursor-pointer transition">📦 Check Stock</button>
            <button @click="aiUserInput = 'Contact WhatsApp support'; sendAiMessage();" class="bg-teal-950 hover:bg-teal-900 text-teal-300 border border-teal-700/60 px-2.5 py-1 rounded-xl whitespace-nowrap cursor-pointer transition">💬 WhatsApp Help</button>
        </div>

        <!-- INPUT FORM -->
        <form @submit.prevent="sendAiMessage()" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
            <input type="text" x-model="aiUserInput" @keyup.enter="sendAiMessage()" placeholder="Ask about products, stock, or WhatsApp..." class="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-white outline-none focus:border-teal-400 transition font-medium">
            <button type="button" @click="sendAiMessage()" class="bg-gradient-to-r from-teal-600 to-teal-700 hover:from-teal-500 hover:to-teal-600 text-white font-black px-4 py-2.5 rounded-xl text-xs cursor-pointer shadow-lg transition active:scale-95">Send</button>
        </form>
    </div>

    <!-- STICKY TOP CONTAINER -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-white shadow-sm">
        <header class="bg-teal-800 text-white py-3 px-4 shadow-md">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                <a href="index.html" class="flex items-center gap-2 text-white hover:text-teal-200 transition font-bold">
                    <span class="text-sm">⬅ Return To Main Catalog</span>
                </a>
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-md bg-white flex items-center justify-center p-0.5 overflow-hidden">
                        <img src="logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/32x32?text=🦷'">
                    </div>
                    <span class="text-amber-400 font-black tracking-wider uppercase text-[11px]">DELIVERY NODE SELECTION</span>
                </div>
            </div>
        </header>

        <!-- GLOBAL CATEGORIES STRIP -->
        <div class="bg-white shadow-md border-b border-slate-100 py-2.5 overflow-x-auto">
            <div class="max-w-6xl mx-auto px-4 flex items-center justify-start md:justify-center gap-4 min-w-max text-center">
                <button type="button" @click="navigateToCategory('all')" class="flex items-center gap-1.5 px-3 py-1.5 border rounded-xl bg-slate-50 border-slate-200 text-slate-700 hover:border-teal-600 hover:text-teal-800 transition font-bold cursor-pointer">
                    ✨ For You
                </button>
                <template x-for="tabItem in directories" :key="tabItem.id">
                    <button type="button" @click="navigateToCategory(tabItem.id)" class="flex items-center gap-1.5 px-3 py-1.5 border rounded-xl bg-slate-50 border-slate-200 text-slate-700 hover:border-teal-600 hover:text-teal-800 transition font-bold cursor-pointer">
                        <span x-text="tabItem.icon || '📦'"></span><span x-text="tabItem.name"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl mx-auto w-full p-4 my-6 flex-1 grid grid-cols-1 md:grid-cols-12 gap-6">
        
        <!-- LEFT: BASKET SUMMARY -->
        <div class="md:col-span-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs h-fit space-y-4">
            <h3 class="font-black text-slate-900 uppercase tracking-wide border-b pb-2 flex items-center gap-1.5">
                <span>📦</span> BASKET SUMMARY
            </h3>

            <div class="space-y-2 max-h-60 overflow-y-auto">
                <template x-for="item in cartItems" :key="item.id">
                    <div class="flex justify-between items-center text-xs py-1 border-b border-slate-100 last:border-none">
                        <div>
                            <p class="font-bold text-slate-800 line-clamp-1" x-text="`${item.qty}x ${item.name}`"></p>
                            <p class="text-[10px] text-slate-400" x-text="`₹${formatCurrency(item.price)} each`"></p>
                        </div>
                        <span class="font-black text-slate-900" x-text="`₹${formatCurrency(item.price * item.qty)}`"></span>
                    </div>
                </template>
            </div>

            <div class="border-t pt-3 space-y-1.5 text-xs">
                <div class="flex justify-between text-slate-500">
                    <span>Subtotal:</span>
                    <span class="font-bold text-slate-800" x-text="`₹${formatCurrency(getCartRunningSumTotal())}`"></span>
                </div>
                <div class="flex justify-between text-sm font-black text-teal-800 border-t pt-2">
                    <span>TOTAL AMOUNT:</span>
                    <span x-text="`₹${formatCurrency(getCartRunningSumTotal())}`"></span>
                </div>
            </div>
        </div>

        <!-- RIGHT: SHIPPING ADDRESS SELECTION -->
        <div class="md:col-span-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-black text-slate-900 uppercase tracking-wide flex items-center gap-1.5">
                    <span>📍</span> SHIPPING CONTEXT
                </h3>
                <button type="button" @click="showAddressForm = true; resetAddressForm();" class="text-teal-700 hover:text-teal-900 font-bold text-xs cursor-pointer">
                    + ADD NEW ADDRESS
                </button>
            </div>

            <!-- INLINE ADD ADDRESS FORM WITH PINCODE AUTO-FILL -->
            <div x-show="showAddressForm" class="bg-slate-50 border p-4 rounded-xl space-y-3" x-transition x-cloak>
                <h4 class="font-black text-slate-900 text-xs uppercase tracking-wide">Register New Address Node</h4>
                
                <div class="flex gap-2">
                    <button type="button" @click="newAddressData.address_type = 'clinic'" 
                            :class="newAddressData.address_type === 'clinic' ? 'bg-teal-800 text-white font-black' : 'bg-white text-slate-700 border'" 
                            class="px-4 py-1.5 rounded-xl text-xs cursor-pointer flex-1">🏥 Clinic</button>
                    <button type="button" @click="newAddressData.address_type = 'home'" 
                            :class="newAddressData.address_type === 'home' ? 'bg-teal-800 text-white font-black' : 'bg-white text-slate-700 border'" 
                            class="px-4 py-1.5 rounded-xl text-xs cursor-pointer flex-1">🏠 Home</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" x-model="newAddressData.clinic_name" placeholder="Clinic / Hospital Title *" class="p-2 border bg-white rounded-xl text-xs outline-none focus:border-teal-600">
                    <input type="text" x-model="newAddressData.phone" maxlength="10" placeholder="10-Digit Mobile Phone *" class="p-2 border bg-white rounded-xl text-xs font-mono outline-none focus:border-teal-600">
                    <input type="text" x-model="newAddressData.address" placeholder="Full Address Details *" class="p-2 border bg-white rounded-xl text-xs outline-none focus:border-teal-600 sm:col-span-2">
                    <input type="text" x-model="newAddressData.landmark" placeholder="Landmark Reference" class="p-2 border bg-white rounded-xl text-xs outline-none focus:border-teal-600">
                    
                    <!-- PINCODE AUTO-FILL -->
                    <div class="relative">
                        <input type="text" x-model="newAddressData.pincode" @input="autoFetchPincodeDetails()" maxlength="6" placeholder="Pincode (e.g. 400054) *" class="w-full p-2 border bg-white rounded-xl text-xs outline-none focus:border-teal-600 font-mono">
                        <span x-show="isFetchingPin" class="absolute right-2.5 top-2 text-[10px] text-teal-700 font-bold animate-pulse">Auto-filling...</span>
                    </div>

                    <input type="text" x-model="newAddressData.city" placeholder="City / District *" class="p-2 border bg-slate-100 rounded-xl text-xs outline-none focus:border-teal-600 font-semibold text-slate-800">
                    <input type="text" x-model="newAddressData.state" placeholder="State *" class="p-2 border bg-slate-100 rounded-xl text-xs outline-none focus:border-teal-600 font-semibold text-slate-800 sm:col-span-2">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" @click="showAddressForm = false;" class="bg-slate-200 text-slate-700 font-bold px-4 py-1.5 rounded-xl text-xs cursor-pointer">Cancel</button>
                    <button type="button" @click="saveNewAddress()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-5 py-1.5 rounded-xl text-xs cursor-pointer">Save Address</button>
                </div>
            </div>

            <!-- SAVED ADDRESSES LIST -->
            <div class="space-y-3">
                <template x-for="addr in addresses" :key="addr.id">
                    <label :class="selectedAddressId === addr.id ? 'border-teal-700 bg-teal-50/50 shadow-xs' : 'border-slate-200 bg-slate-50'" 
                           class="border p-4 rounded-2xl flex items-start gap-3 cursor-pointer transition block">
                        <input type="radio" name="deliveryAddress" :value="addr.id" x-model="selectedAddressId" class="mt-1 text-teal-700 cursor-pointer">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <h4 class="font-black text-slate-900 uppercase text-xs" x-text="addr.clinic_name || 'Clinic Destination'"></h4>
                                <span class="bg-teal-100 text-teal-800 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase" x-text="addr.address_type || 'Clinic'"></span>
                            </div>
                            <p class="text-slate-600 text-xs mt-1 leading-relaxed" x-text="`${addr.address}, ${addr.landmark ? addr.landmark + ', ' : ''}${addr.city}, ${addr.state} - ${addr.pincode}`"></p>
                            <p class="text-[10px] text-slate-400 font-mono mt-1" x-text="`Phone: +91 ${addr.phone || 'N/A'}`"></p>
                        </div>
                    </label>
                </template>

                <p x-show="addresses.length === 0 && !showAddressForm" class="text-slate-400 text-center py-12 text-xs italic">
                    No delivery addresses found. Click "+ ADD NEW ADDRESS" above to create one.
                </p>
            </div>

            <!-- PROCEED BUTTON -->
            <button @click="proceedToPayment()" :disabled="!selectedAddressId" 
                    :class="selectedAddressId ? 'bg-[#fb641b] hover:bg-[#f2570c] text-white cursor-pointer' : 'bg-slate-300 text-slate-500 cursor-not-allowed'"
                    class="w-full font-black py-3 rounded-xl uppercase tracking-wider text-xs shadow-md transition">
                PROCEED TO PAYMENT ROUTE ➔
            </button>
        </div>

    </main>

    <script>
        const API_BASE = 'https://dentist-bazar-backend.onrender.com/api';

        function addressApp() {
            return {
                cartItems: [],
                directories: [],
                addresses: [],
                selectedAddressId: '',
                showAddressForm: false,
                isFetchingPin: false,
                currentUser: null,
                newAddressData: { clinic_name: '', address_type: 'clinic', address: '', landmark: '', pincode: '', city: '', state: '', phone: '' },
                
                // INTELLIGENT AI COPILOT STATE WITH PERSISTENT CHAT HISTORY & AUTO SCROLL
                aiDrawerOpen: false,
                aiUserInput: '',
                aiMessages: [
                    { role: 'bot', text: 'Hello Doctor! I am your Dentist Bazar Smart AI Copilot. Ask me about any dental equipment, check stock, or add products directly to your cart!', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }
                ],

                async initAddressPage() {
                    const userStr = localStorage.getItem('sbe_user');
                    if (userStr && userStr !== 'undefined' && userStr !== 'null') {
                        try { this.currentUser = JSON.parse(userStr); } catch(e) {}
                    }

                    const cachedCart = localStorage.getItem('sb_dent_cart');
                    if (cachedCart) {
                        try { this.cartItems = JSON.parse(cachedCart); } catch(e) {}
                    }

                    // RESTORE PERSISTENT CHAT HISTORY
                    const savedChat = localStorage.getItem('sbe_ai_chat_history');
                    if (savedChat) {
                        try {
                            const parsedChat = JSON.parse(savedChat);
                            if (Array.isArray(parsedChat) && parsedChat.length > 0) {
                                this.aiMessages = parsedChat;
                            }
                        } catch(e) {}
                    }

                    await this.loadDirectories();
                    await this.loadAddresses();
                },

                async loadDirectories() {
                    try {
                        const res = await fetch(`${API_BASE}/directories`);
                        if (res.ok) this.directories = await res.json();
                    } catch(e) {}
                },

                navigateToCategory(catId) {
                    localStorage.setItem('sb_active_cat', catId);
                    window.location.href = 'index.html';
                },

                async loadAddresses() {
                    try {
                        const url = this.currentUser ? `${API_BASE}/addresses?user_id=${this.currentUser.id}` : `${API_BASE}/addresses`;
                        const res = await fetch(url);
                        if (res.ok) {
                            this.addresses = await res.json();
                            if (this.addresses.length > 0) {
                                this.selectedAddressId = this.addresses[0].id;
                            }
                        }
                    } catch (err) {
                        console.error("Error loading addresses:", err);
                    }
                },

                resetAddressForm() {
                    this.newAddressData = { clinic_name: '', address_type: 'clinic', address: '', landmark: '', pincode: '', city: '', state: '', phone: this.currentUser?.phone || '' };
                },

                async autoFetchPincodeDetails() {
                    const pin = (this.newAddressData.pincode || '').trim();
                    if (pin.length === 6 && /^\d{6}$/.test(pin)) {
                        this.isFetchingPin = true;
                        try {
                            const res = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
                            const data = await res.json();
                            if (data && data[0] && data[0].Status === "Success" && data[0].PostOffice?.length > 0) {
                                const po = data[0].PostOffice[0];
                                this.newAddressData.city = po.District || po.Division || '';
                                this.newAddressData.state = po.State || '';
                            }
                        } catch(e) {
                            console.error("Failed to auto-lookup pincode:", e);
                        } finally {
                            this.isFetchingPin = false;
                        }
                    }
                },

                async saveNewAddress() {
                    if (!this.newAddressData.clinic_name || !this.newAddressData.address || !this.newAddressData.pincode || !this.newAddressData.city || !this.newAddressData.state || !this.newAddressData.phone) {
                        alert("Please fill in all required fields.");
                        return;
                    }

                    try {
                        const payload = {
                            user_id: this.currentUser ? this.currentUser.id : null,
                            clinic_name: this.newAddressData.clinic_name,
                            address_type: this.newAddressData.address_type,
                            address: this.newAddressData.address,
                            landmark: this.newAddressData.landmark,
                            pincode: this.newAddressData.pincode,
                            city: this.newAddressData.city,
                            state: this.newAddressData.state,
                            phone: this.newAddressData.phone
                        };

                        const res = await fetch(`${API_BASE}/addresses`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (res.ok) {
                            const created = await res.json();
                            this.addresses.unshift(created);
                            this.selectedAddressId = created.id;
                            this.showAddressForm = false;
                            this.resetAddressForm();
                        } else {
                            alert("Failed to save address to database.");
                        }
                    } catch (err) {
                        alert("Failed to save address: " + err.message);
                    }
                },

                getCartRunningSumTotal() {
                    return this.cartItems.reduce((sum, i) => sum + ((i.price || 0) * (i.qty || 0)), 0);
                },

                formatCurrency(val) {
                    return new Intl.NumberFormat('en-IN').format(val || 0);
                },

                // INTELLIGENT AI COPILOT LOGIC WITH AUTO-SCROLL
                async sendAiMessage() {
                    const text = (this.aiUserInput || '').trim();
                    if (!text) return;

                    const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.aiMessages.push({ role: 'user', text: text, time: currentTime });
                    this.aiUserInput = '';

                    this.$nextTick(() => {
                        const container = this.$refs.chatContainer;
                        if (container) { container.scrollTop = container.scrollHeight; }
                    });

                    const qLower = text.toLowerCase();
                    let botReply = "";

                    if (qLower.includes('whatsapp') || qLower.includes('contact') || qLower.includes('call') || qLower.includes('message')) {
                        const waText = encodeURIComponent(`Hello S.B. Enterprises, I need assistance with: "${text}"`);
                        botReply = `💬 You can connect with our support desk instantly via WhatsApp:<br><a href="https://api.whatsapp.com/send?phone=919955335236&text=${waText}" target="_blank" class="text-emerald-400 underline font-bold">Click here to open WhatsApp Chat ➔</a>`;
                    } else {
                        try {
                            const res = await fetch(`${API_BASE}/ai/chat`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ query: text })
                            });
                            const data = await res.json();
                            botReply = data.answer || "I am here to help you navigate our dental equipment catalog, check prices, and manage your orders!";
                        } catch(e) {
                            botReply = "I am connected to your store database. Ask me about any equipment, pricing, stock availability, or WhatsApp support!";
                        }
                    }

                    this.aiMessages.push({ role: 'bot', text: botReply, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
                    localStorage.setItem('sbe_ai_chat_history', JSON.stringify(this.aiMessages));

                    this.$nextTick(() => {
                        const container = this.$refs.chatContainer;
                        if (container) { container.scrollTop = container.scrollHeight; }
                    });
                },

                proceedToPayment() {
                    if (!this.selectedAddressId) return;
                    const selectedAddrObj = this.addresses.find(a => a.id === this.selectedAddressId);
                    if (selectedAddrObj) {
                        const fullAddrStr = `${selectedAddrObj.clinic_name}, ${selectedAddrObj.address}, ${selectedAddrObj.landmark ? selectedAddrObj.landmark + ', ' : ''}${selectedAddrObj.city}, ${selectedAddrObj.state} - ${selectedAddrObj.pincode} (Ph: ${selectedAddrObj.phone})`;
                        localStorage.setItem('sb_selected_checkout_address', fullAddrStr);
                        localStorage.setItem('sbe_selected_address', fullAddrStr);
                    }
                    window.location.href = 'payment.html';
                }
            }
        }
    </script>
</body>
</html>
